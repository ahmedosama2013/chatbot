<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Chatbot</title>
  <meta name="description" content="Chatbot — a fast, clean AI chat interface." />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <span class="brand-name">Chatbot</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>

      <p class="history-label">Recent</p>
      <nav class="history" id="historyList" aria-label="Chat history"></nav>

      <div class="sidebar-bottom">
        <div class="credits">
          <span class="credits-label">Made by</span>
          <a class="credits-email" href="mailto:ahmedosama2013b@gmail.com">ahmedosama2013b@gmail.com</a>
          <a class="github-pill" href="https://github.com/ahmedosama2013/chatbot" target="_blank" rel="noopener noreferrer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.03 3.26 9.29 7.79 10.8.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.17.69-3.84-1.36-3.84-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.25 3.33.95.1-.74.4-1.25.72-1.53-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.17.91-.25 1.89-.38 2.86-.38.97 0 1.95.13 2.86.38 2.18-1.48 3.14-1.17 3.14-1.17.62 1.57.23 2.73.11 3.02.73.8 1.17 1.82 1.17 3.06 0 4.37-2.66 5.34-5.2 5.62.41.36.77 1.06.77 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.2.66.79.55A10.53 10.53 0 0 0 23.5 12.02C23.5 5.74 18.27.5 12 .5Z"/></svg>
            View on GitHub
          </a>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">Chatbot</div>
        <button class="icon-btn danger" id="clearBtn" aria-label="Delete this conversation" title="Delete this conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </header>

      <main class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">
            <span class="orb" aria-hidden="true"></span>
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </div>
          <h1>Chatbot</h1>
          <p>Ask anything. Answers land right below.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion-card" data-prompt="Explain quantum computing in simple terms">
              <span class="suggestion-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
              </span>
              <strong>Explain a concept</strong>
              <span>Quantum computing in simple terms</span>
            </button>
            <button class="suggestion-card" data-prompt="Give me 5 creative ideas for a birthday gift">
              <span class="suggestion-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 5.2L20 8l-4 4.1L17 18l-5-2.7L7 18l1-5.9L4 8l5.6-.8L12 2z"/></svg>
              </span>
              <strong>Brainstorm ideas</strong>
              <span>5 creative birthday gift ideas</span>
            </button>
            <button class="suggestion-card" data-prompt="Write a short professional email asking for a deadline extension">
              <span class="suggestion-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              </span>
              <strong>Draft an email</strong>
              <span>Politely ask for a deadline extension</span>
            </button>
            <button class="suggestion-card" data-prompt="Debug this: why would a for loop cause an infinite loop in JavaScript?">
              <span class="suggestion-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4L3 12l5 8M16 4l5 8-5 8"/></svg>
              </span>
              <strong>Help with code</strong>
              <span>Why for-loops can go infinite</span>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>
      </main>

      <form class="composer" id="composerForm">
        <div class="composer-inner">
          <textarea
            id="userInput"
            class="composer-input"
            placeholder="Message Chatbot..."
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <p class="disclaimer">Chatbot can make mistakes. Consider checking important information.</p>
      </form>
    </div>
  </div>

  <!-- Custom confirmation modal (replaces native browser confirm/context menu) -->
  <div class="modal-backdrop" id="modalBackdrop" role="presentation">
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
      <h2 id="modalTitle">Delete chat?</h2>
      <p id="modalBody">This will permanently remove this conversation. This can't be undone.</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-cancel" id="modalCancel">Cancel</button>
        <button type="button" class="modal-btn modal-confirm" id="modalConfirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
